name: Monitor latest news freshness

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: news-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check published latest-news.json
        id: freshness
        run: node scripts/check-latest-news.mjs --max-age-minutes=45 --soft-stale

      - name: Trigger deploy refresh when stale
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Report monitor recovery
        if: steps.freshness.outputs.stale == 'true'
        run: |
          echo "::warning::latest-news.json is stale; deploy workflow was dispatched."
